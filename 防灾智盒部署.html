radius:10px;box-shadow:0 14px 32px rgba(15,23,42,.18);cursor:default}.version-popover.open{display:block}.version-popover:before{content:"";position:absolute;top:-7px;left:226px;width:12px;height:12px;background:#fff;border-left:1px solid #dbe5f0;border-top:1px solid #dbe5f0;transform:rotate(45deg)}.popover-head{height:48px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.popover-head strong{font-size:14px}.popover-close{width:28px;height:28px;border:0;background:transparent;color:#64748b;font-size:20px;cursor:pointer}.version-grid{display:grid;grid-template-columns:repeat(4,1fr);padding:8px 12px 12px}.version-item{min-height:50px;padding:9px 12px;border-bottom:1px solid #edf1f6;display:flex;align-items:center;justify-content:space-between;gap:10px}.version-item:nth-last-child(-n+4){border-bottom:0}.version-name{color:#475569;white-space:nowrap}.version-number{color:#1d4ed8;font-family:Consolas,monospace;font-weight:700;white-space:nowrap}.section-head{padding:17px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.toolbar{padding:12px 16px;background:#fbfcfe;border-bottom:1px solid var(--line);display:flex;gap:10px}.control{height:34px;border:1px solid #d6e0ec;border-radius:7px;background:#fff;padding:0 11px;color:#475569;font-size:12px}.search{width:240px}.btn{height:34px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;padding:0 13px;color:#475569;font-size:12px;cursor:pointer}.btn:hover{border-color:#93c5fd;color:var(--primary)}.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px}th{height:43px;padding:0 16px;background:#f8fafc;color:#64748b;text-align:left;font-weight:600;white-space:nowrap}td{height:58px;padding:0 16px;border-top:1px solid #edf1f6;color:#334155}tbody tr:hover{background:#fbfdff}.unit-name{font-weight:650;color:# 24px;top:86px;padding:11px 16px;background:#12345a;color:#fff;border-radius:8px;z-index:1400;font-size:12px;display:none}.toast.show{display:block}@media(max-width:1200px){.overview{grid-template-columns:1.4fr repeat(3,1fr)}.version-popover{left:-130px;width:760px}.version-grid{grid-template-columns:repeat(4,1fr)}.version-popover:before{left:170px}}@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
    .version-popover{width:min(920px,calc(100vw - 450px))}

<body>
  <aside></aside>
  <div class="page">
    <header class="page-head"><div><div class="crumb">算法训练中心 / 防灾智盒部署</div><div class="page-title">防灾智盒部署</div></div><div class="head-note"><i class="fa fa-refresh"></i> 数据更新时间：2026-09-05 10:20</div></header>
    <main class="content">
      <section class="overview" aria-label="防灾智盒部署概览">
        <div class="overview-intro"><div class="overview-icon"><i class="fa fa-shield"></i></div><div><h2>公司级版本态势</h2><p>统一掌握各单位防灾智盒在线与算法升级情况。</p></div></div>
        <div id="algorithmMetric" class="metric algorithm-metric" role="button" tabindex="0" aria-expanded="false" aria-controls="versionPopover"><div class="metric-label">当前算法</div><div class="metric-value">20</div><div class="metric-sub metric-entry">查看最新版本 <i class="fa fa-angle-down"></i></div>
          <div id="versionPopover" class="version-popover" role="dialog" aria-label="20个算法最新版本"><div class="popover-head"><strong>20个算法最新版本</strong><button id="popoverClose" class="popover-close" aria-label="关闭">×</button></div><div id="versionGrid" class="version-grid"></div></div>
        </div>
        <div class="metric"><div class="metric-label">防灾智盒总数</div><div class="metric-value">86</div><div class="metric-sub">覆盖 8 个下级单位</div></div>
        <div class="metric"><div class="metric-label">在线 / 待升级</div><div class="metric-value"><span class="green">81</span> <small>/</small> <span class="warn">17</span></div><div class="metric-sub">在线率 94.2%</div></div>
      </section>
      <section class="section">
        <div class="section-head"><div><h2>下级单位防灾智盒列表</h2><p>按单位查看智盒规模、在线状态和版本差异</p></div><button id="syncBtn" class="btn"><i class="fa fa-refresh"></i> 同步版本状态</button></div>
        <div class="toolbar"><select id="statusFilter" class="control"><option value="">全部升级状态</option><option value="upgrade">存在待升级</option><option value="latest">全部最新</option></select><input id="keyword" class="control search" placeholder="搜索单位名称"><button id="resetBtn" class="btn">重置</button></div>
        <div class="table-wrap"><table><thead><tr><th style="width:70px">序号</th><th>单位名称</th><th>防灾智盒总数</th><th>在线数</th><th>在线率</th><th>待升级数</th><th>版本状态</th><th>最近同步时间</th><th style="text-align:right">操作</th></tr></thead><tbody id="unitRows"></tbody></table></div>
        <div class="pagination"><span id="resultCount"></span><span>当前展示全部结果</span></div>
      </section>
    </main>
  </div>
  <div id="mask" class="mask"></div>
  <aside id="drawer" class="drawer" data-keep-sidebar="true" aria-hidden="true">
    <div class="drawer-head"><div><div class="crumb">防灾智盒部署 / 管理版本</div><div id="drawerTitle" class="drawer-title"></div></div><button id="closeBtn" class="close" aria-label="关闭">×</button></div>
    <div id="drawerSummary" class="drawer-summary"></div>
    <div class="drawer-body"><div class="algo-table"><table><thead><tr><th>算法名称</th><th>单位当前版本</th><th>公司最新版本</th><th>升级状态</th></tr></thead><tbody id="algoRows"></tbody></table></div></div>
    <div class="drawer-actions"><button id="cancelBtn" class="btn">关闭</button><button id="upgradeBtn" class="btn primary"><i class="fa fa-cloud-upload"></i> 升级全部待升级算法</button></div>
  </aside>
  <div id="toast" class="toast"></div>
  <script>
    const units=[
      {code:'DW-001',name:'齐大山选矿厂',total:14,online:14,upgrade:3,time:'2026-09-05 10:18'},
      {code:'DW-002',name:'眼前山铁矿',total:13,online:12,upgrade:4,time:'2026-09-05 10:16'},
      {code:'DW-003',name:'东鞍山烧结厂',total:12,online:12,upgrade:0,time:'2026-09-05 10:15'},
      {code:'DW-004',name:'弓长岭矿业',total:11,online:10,upgrade:3,time:'2026-09-05 10:12'},
      {code:'DW-005',name:'大孤山球团厂',total:10,online:10,upgrade:1,time:'2026-09-05 10:09'},
      {code:'DW-006',name:'鞍千矿业',total:9,online:8,upgrade:2,time:'2026-09-05 10:06'},
      {code:'DW-007',name:'关宝山矿业',total:9,online:8,upgrade:4,time:'2026-09-05 10:03'},
      {code:'DW-008',name:'矿建工程公司',total:8,online:7,upgrade:0,time:'2026-09-05 09:58'}
    ];
    const algorithms=[['安全帽识别','V3.6.2'],['反光衣识别','V2.8.1'],['人员入侵识别','V4.1.0'],['烟火识别','V3.2.5'],['抽烟识别','V2.5.3'],['打电话识别','V2.4.6'],['人员聚集识别','V3.1.2'],['区域滞留识别','V2.9.4'],['跌倒识别','V2.7.1'],['高处作业识别','V3.3.0'],['动火作业识别','V3.4.2'],['未系安全带识别','V2.6.5'],['车辆违停识别','V3.0.8'],['车辆超速识别','V2.8.7'],['吊装区域入侵','V3.2.1'],['临边防护识别','V2.9.6'],['消防通道占用','V3.1.5'],['设备渗漏识别','V2.5.8'],['皮带跑偏识别','V3.3.4'],['机械防护缺失','V2.7.9']];
    const q=s=>document.querySelector(s);let activeUnit=null;
    function render(){const key=q('#keyword').value.trim(),status=q('#statusFilter').value;const list=units.filter(u=>(!key||u.name.includes(key))&&(!status||(status==='upgrade'?u.upgrade>0:u.upgrade===0)));q('#unitRows').innerHTML=list.map((u,i)=>{const rate=(u.online/u.total*100).toFixed(1);return `<tr><td>${i+1}</td><td><div class="unit-name">${u.name}</div><div class="unit-code">${u.code}</div></td><td><span class="number">${u.total}</span> 台</td><td><span class="number online">${u.online}</span> 台</td><td><b>${rate}%</b><div class="progress"><i style="width:${rate}%"></i></div></td><td><span class="number ${u.upgrade?'upgrade':''}">${u.upgrade}</span> 台</td><td>${u.upgrade?`<span class="tag warn">${u.upgrade} 台待升级</span>`:'<span class="tag ok"><i class="dot"></i>全部最新</span>'}</td><td>${u.time}</td><td style="text-align:right"><a class="link" href="边缘盒子部署.html?unit=${encodeURIComponent(u.code)}">管理版本 <i class="fa fa-angle-right"></i></a></td></tr>`}).join('');q('#resultCount').textContent=`共 ${units.length} 个单位 · 当前展示 ${list.length} 个`}
    function openDrawer(unit){activeUnit=unit;q('#drawerTitle').textContent=unit.name+' · 算法版本';q('#drawerSummary').innerHTML=`<span>当前算法<b>20</b></span><span>待升级智盒<b class="upgrade">${unit.upgrade} 台</b></span>`;q('#algoRows').innerHTML=algorithms.map(([name,latest],i)=>{const old=i<unit.upgrade;const parts=latest.split('.');const current=old?parts.slice(0,-1).concat(Math.max(0,Number(parts.at(-1))-1)).join('.'):latest;return `<tr><td>${name}</td><td class="version">${current}</td><td class="version">${latest}</td><td>${old?'<span class="tag warn">待升级</span>':'<span class="tag ok">已是最新</span>'}</td></tr>`}).join('');q('#upgradeBtn').disabled=!unit.upgrade;q('#mask').classList.add('open');q('#drawer').classList.add('open');q('#drawer').setAttribute('aria-hidden','false')}
    function closeDrawer(){q('#mask').classList.remove('open');q('#drawer').classList.remove('open');q('#drawer').setAttribute('aria-hidden','true')}
    function toast(text){q('#toast').textContent=text;q('#toast').classList.add('show');setTimeout(()=>q('#toast').classList.remove('show'),2200)}
    function setVersionPopover(open){q('#versionPopover').classList.toggle('open',open);q('#algorithmMetric').setAttribute('aria-expanded',String(open))}
    q('#versionGrid').innerHTML=algorithms.map(([name,version])=>`<div class="version-item"><span class="version-name">${name}</span><span class="version-number">${version}</span></div>`).join('');
    render();q('#keyword').oninput=render;q('#statusFilter').onchange=render;q('#resetBtn').onclick=()=>{q('#keyword').value='';q('#statusFilter').value='';render()};q('#syncBtn').onclick=()=>toast('版本状态同步完成');q('#algorithmMetric').onclick=e=>{if(e.target.closest('#versionPopover')&&!e.target.closest('#popoverClose'))return;setVersionPopover(q('#algorithmMetric').getAttribute('aria-expanded')!=='true')};q('#algorithmMetric').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setVersionPopover(q('#algorithmMetric').getAttribute('aria-expanded')!=='true')}};q('#popoverClose').onclick=e=>{e.stopPropagation();setVersionPopover(false)};document.addEventListener('click',e=>{if(!q('#algorithmMetric').contains(e.target))setVersionPopover(false)});q('#mask').onclick=closeDrawer;q('#closeBtn').onclick=closeDrawer;q('#cancelBtn').onclick=closeDrawer;q('#upgradeBtn').onclick=()=>{closeDrawer();toast(`${activeUnit.name} 的版本升级任务已创建`)};document.addEventListener('keydown',e=>{if(e.key==='Escape'){setVersionPopover(false);closeDrawer()}});
  </script>
