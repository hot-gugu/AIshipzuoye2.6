<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>系统管理 - 视频AI识别自进化能力平台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#1f2d43;font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif}.system-page{min-height:100vh}.page-head{height:64px;padding:0 26px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #dfe7f1}.crumb{font-size:13px;color:#7b8ba2}.page-head h1{margin:4px 0 0;font-size:19px}.status{padding:6px 11px;border-radius:999px;background:#eaf8f2;color:#07865b;font-size:12px}.page-main{padding:22px 26px}.intro{padding:20px 22px;margin-bottom:18px;background:#fff;border:1px solid #dde6f0;border-radius:10px}.intro h2{margin:0 0 7px;font-size:18px}.intro p{margin:0;color:#6b7b91;font-size:13px}.modules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.module{min-height:150px;padding:20px;background:#fff;border:1px solid #dde6f0;border-radius:10px}.module-icon{width:38px;height:38px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;border-radius:8px;background:#eaf2ff;color:#1764cf}.module h3{margin:0 0 8px;font-size:16px}.module p{margin:0;color:#74839a;font-size:13px;line-height:1.7}@media(max-width:900px){.modules{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="system-page">
    <header class="page-head"><div><div class="crumb">系统管理 / 管理中心</div><h1>系统管理</h1></div><span class="status">● 系统运行正常</span></header>
    <main class="page-main">
      <section class="intro"><h2>系统组织与权限管理</h2><p>统一维护平台成员、组织架构、角色权限与岗位信息。</p></section>
      <section class="modules">
        <article class="module"><div class="module-icon"><i class="fa fa-users"></i></div><h3>成员管理</h3><p>维护系统成员资料、账号状态和所属组织。</p></article>
        <article class="module"><div class="module-icon"><i class="fa fa-sitemap"></i></div><h3>组织架构</h3><p>管理集团、厂矿及基层单位的组织层级。</p></article>
        <article class="module"><div class="module-icon"><i class="fa fa-user-secret"></i></div><h3>角色管理</h3><p>配置角色及其可访问的业务功能和数据范围。</p></article>
        <article class="module"><div class="module-icon"><i class="fa fa-id-badge"></i></div><h3>岗位管理</h3><p>建立岗位信息并关联成员职责与系统角色。</p></article>
      </section>
    </main>
  </div>
  <script src="navigation.js?v=20260903-6"></script>
</body>
</html>
